<!doctype html>
<meta charset="utf-8">
<title>Kev state cache test</title>
<pre id="log" style="font: 13px ui-monospace, monospace"></pre>
<script type="module">
import { Kevala } from "../js/src/index.js";
const log = (s) => (document.getElementById("log").textContent += s + "\n");
window.ct = null;
const query = new URLSearchParams(location.search);
const backend = query.get("backend") || "webgpu";
const threads = Number(query.get("threads") || 1);
const flavor = query.get("flavor") || undefined;
const model = query.get("model") || "../tmp/kev-0.8b-q8.kevala";
const repeat = Number(query.get("repeat") || 1);
const Q = {
  a: { type: "noul", instructions: "Does the customer want money back?" },
  b: { type: "choice", instructions: "Which team?", criteria: { billing: "payments", shipping: "deliveries", other: null } },
};
const flat = (r) => [...r.raw_probabilities.a, ...r.raw_probabilities.b];
const diff = (a, b) => Math.max(...a.map((v, i) => Math.abs(v - b[i])));
// More unrelated states than the cache holds, each long enough to be cached: after them the
// cache has forgotten the states under test, so the same model computes them from scratch.
const EVICTORS = [
  "The quarterly maintenance window for the storage cluster moved to Saturday night, and every team must confirm its backup schedule with operations before Thursday at noon.",
  "Our newsletter this month covers the new office in Lisbon, three open engineering roles, and a short interview with the designer who rebuilt the onboarding flow last spring.",
  "Please find attached the signed lease renewal for the warehouse on Dock Street, together with the insurance certificate and the updated list of authorized key holders.",
  "Reminder that the conference badge pickup opens at eight in the morning, the keynote starts at nine thirty, and lunch vouchers are valid only at the two cafes on level one.",
  "Weather for the weekend looks mild with light wind from the west, a small chance of showers on Sunday afternoon, and temperatures a little above the seasonal average.",
  "The library extended its opening hours during exams, added forty quiet desks on the third floor, and now lends laptop chargers and noise cancelling headphones at the front desk.",
];
try {
  if (!Number.isInteger(repeat) || repeat < 1 || repeat > 32) throw new Error("repeat must be an integer from 1 to 32");
  const base = Array(repeat).fill("Order #4411 arrived two weeks late and the box was crushed on one side. I was also charged twice for it on my credit card, and the second charge is still pending.").join(" ");
  const longer = base + " I called support on Monday and nobody answered, so please refund the duplicate charge today.";
  const warm = await Kevala.load({ model, backend, threads, flavor });
  const info = { backend: warm.info.backend, threads: warm.info.threads, flavor: warm.info.flavor };
  const warmGpuTuning = warm.info.gpuTuning;
  const t = [];
  const time = async (s) => { const t0 = performance.now(); const r = await warm.decide(s, Q); t.push(Math.round(performance.now() - t0)); return r; };
  const miss = await time(base);
  const hit = await time(base);
  const ext = await time(longer);
  const stats = ext.timing.cache;
  // The reference runs in this same model, so it uses the kernels this load selected. A second
  // load calibrates again and can select other kernels, whose rounding differs.
  for (const state of EVICTORS) await warm.decide(state, Q);
  const fresh = await warm.decide(longer, Q);
  const after = fresh.timing.cache;
  if (stats && (after.misses !== stats.misses + EVICTORS.length + 1 || after.hits !== stats.hits || after.extensions !== stats.extensions)) {
    throw new Error(`the reference run was not computed from scratch: ${JSON.stringify(after)}`);
  }
  warm.dispose();
  window.ct = { ...info, model, repeat, requestedBackend: backend, hardwareConcurrency: navigator.hardwareConcurrency || null, crossOriginIsolated: globalThis.crossOriginIsolated === true, gpuTuning: warmGpuTuning, stats, statsAfterReference: after || null, ms: { miss: t[0], hit: t[1], extension: t[2] }, probabilities: { miss: flat(miss), hit: flat(hit), extension: flat(ext), fresh: flat(fresh) }, hitVsMiss: diff(flat(hit), flat(miss)), extVsFresh: diff(flat(ext), flat(fresh)), done: true };
} catch (e) { window.ct = { done: true, error: e.message }; }
log(JSON.stringify(window.ct));
</script>
