<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kevala example: basic</title>
<link rel="icon" href="data:,">
<style>
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #0b0d12; color: #e7ecf3; }
  textarea { width: 100%; min-height: 90px; font: inherit; background: #11151d; color: inherit; border: 1px solid #2c3749; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #2c3749; background: #1a2130; color: inherit; cursor: pointer; }
  pre { background: #11151d; border: 1px solid #2c3749; border-radius: 8px; padding: 12px; overflow: auto; font-size: 13px; }
  .muted { color: #8591a5; }
</style>
</head>
<body>
<h1>Basic: load once, decide many times</h1>
<p class="muted">Loads Laya, then answers three typed questions about the text in one forward pass.</p>
<textarea id="text">Hi team, the invoice you sent charges us twice for March. Can you fix it before Friday? Our finance close is that day.</textarea>
<p><button id="go" disabled>Decide</button> <span id="status" class="muted">Loading the model…</span></p>
<pre id="out"></pre>

<script type="module">
import { Kevala } from "https://cdn.jsdelivr.net/npm/kevala@latest/js/src/index.js";


const status = document.getElementById("status");

// 1. Load once. The first visit downloads and converts the model (hundreds of MB); after that it
//    comes from the browser cache in about a second. backend "auto" = WebGPU if available.
const kevala = await Kevala.load({
  model: "laya",
  backend: "auto",
  onProgress: (p) => {
    if (p.phase === "download" && p.total) status.textContent = `Downloading ${Math.round((100 * p.loaded) / p.total)}%`;
    else status.textContent = p.message || p.phase;
  },
});
status.textContent = `Ready on ${kevala.info.backend} in ${Math.round(kevala.info.loadMs)} ms`;

// 2. Questions are typed. Ask what the text says; describe every option.
const questions = {
  urgent: { type: "noul", instructions: "Does the message mention a deadline or time pressure?" },
  team: {
    type: "choice",
    instructions: "Which team should handle the message?",
    criteria: { billing: "invoices, charges, refunds", technical: "bugs, outages, integrations", sales: "pricing, new purchases" },
  },
  tone: { type: "score", instructions: "How upset does the sender sound?", criteria: ["calm", "a bit annoyed", "angry"] },
};

// 3. Decide. `state` can be a string or any JSON value.
const button = document.getElementById("go");
button.disabled = false;
button.onclick = async () => {
  const r = await kevala.decide(document.getElementById("text").value, questions);
  const a = r.answers;
  document.getElementById("out").textContent =
    `urgent: P(yes) = ${a.urgent.noul}\n` +
    `team:   ${a.team.choice} (${JSON.stringify(a.team.probabilities)})\n` +
    `tone:   ${a.tone.legend?.[Math.round(a.tone.score)] ?? a.tone.score} (score ${a.tone.score})\n\n` +
    `forward pass: ${r.timing.forward.toFixed(1)} ms, ${r.usage.input_tokens} tokens\n\n` +
    JSON.stringify(r, null, 2);
};
button.click();
</script>
</body>
</html>
