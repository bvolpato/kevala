name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-22
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.21.0
          install: false
      - name: Tokenizers for the parity tests (pinned revisions)
        run: |
          mkdir -p tmp/laya/tokenizer tmp/kev tmp/qwen35 tmp/gemma4/E2B tmp/gemma4/E4B
          curl -sfL https://huggingface.co/convaiinnovations/laya/resolve/1c5edc17a7acd8701df6fc341c0d179f1c62c982/tokenizer/tokenizer.json -o tmp/laya/tokenizer/tokenizer.json
          curl -sfL https://huggingface.co/jaredpalmer/kev-0.8b/resolve/54f4f8777356cd5bbbb6c6919c657f26e6f2f6d8/tokenizer.json -o tmp/kev/tokenizer.json
          curl -sfL https://huggingface.co/Qwen/Qwen3.5-0.8B-Base/resolve/dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68/tokenizer.json -o tmp/qwen35/tokenizer.json
          curl -sfL https://huggingface.co/Qwen/Qwen3.5-0.8B-Base/resolve/dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68/tokenizer_config.json -o tmp/qwen35/tokenizer_config.json
          curl -sfL https://huggingface.co/google/gemma-4-E2B-it/resolve/3e22461f65e89153144f8adb70e3b8c2cc9845a7/tokenizer.json -o tmp/gemma4/E2B/tokenizer.json
          curl -sfL https://huggingface.co/google/gemma-4-E4B-it/resolve/ee0ef6023621cff504d758262d4e04895a5af4a2/tokenizer.json -o tmp/gemma4/E4B/tokenizer.json
      - run: cargo fmt --all --check
      - run: cargo test --release --workspace
      - name: Build WebAssembly flavors
        run: scripts/build-wasm.sh
      - name: Validate generated WebAssembly
        run: node scripts/check-wasm.mjs
      - name: Check CPU calibration ABI
        run: node scripts/check-cpu-tuning.mjs
      - name: Build CPU numerical harnesses
        run: scripts/build-cpu-bench.sh all
      - name: Check CPU kernels in every WebAssembly flavor
        run: |
          for flavor in relaxed simd base; do
            node scripts/bench-cpu-kernels.mjs guard "$flavor"
          done
      - name: Upload WebAssembly build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ github.sha }}
          path: js/src/*.wasm
          if-no-files-found: error
          retention-days: 7

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - name: Syntax
        run: pnpm check
      - name: JavaScript regression tests
        run: pnpm test
      - name: Validate published decision results
        run: |
          pnpm exec node scripts/report-decisions.mjs \
            --results benchmarks/results/decisions-linux-2026-09-22 \
            --reference benchmarks/results/decisions-linux-2026-09-22/gemma-base-vs-it.json \
            --output "$RUNNER_TEMP/decision-summary.json" \
            --check-summary benchmarks/results/decisions-linux-2026-09-22/summary.json

  package:
    needs: [rust, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-22
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - name: Pack the release candidate
        run: pnpm pack --pack-destination "$RUNNER_TEMP/kevala-package"
      - name: Validate package contents and WebAssembly
        run: |
          package=$(find "$RUNNER_TEMP/kevala-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$package"
          pnpm check:package "$package"
      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/kevala-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  site:
    needs: [rust, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-${{ github.sha }}
          path: js/src
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.21.0
          install: false
      - name: Validate site WebAssembly
        run: node scripts/check-wasm.mjs
      - name: Stage public site
        run: pnpm stage:site
      - name: Upload site build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [package, site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
          include-hidden-files: true
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
