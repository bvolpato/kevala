name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - name: Tokenizers for the parity tests (pinned revisions)
        run: |
          mkdir -p tmp/laya/tokenizer tmp/kev
          curl -sfL https://huggingface.co/convaiinnovations/laya/resolve/1c5edc17a7acd8701df6fc341c0d179f1c62c982/tokenizer/tokenizer.json -o tmp/laya/tokenizer/tokenizer.json
          curl -sfL https://huggingface.co/jaredpalmer/kev-0.8b/resolve/54f4f8777356cd5bbbb6c6919c657f26e6f2f6d8/tokenizer.json -o tmp/kev/tokenizer.json
      - run: cargo fmt --all --check
      - run: cargo test --release --workspace
      - name: WebAssembly builds
        run: scripts/build-wasm.sh
      - name: The committed .wasm files match the sources
        run: git diff --exit-code -- js/src/*.wasm || echo "::warning::rebuilt wasm differs from the committed files"
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in js/src/*.js js/src/archs/*.js app/*.js app/views/*.js app/tetris/*.js scripts/*.mjs; do node --check "$f"; done
