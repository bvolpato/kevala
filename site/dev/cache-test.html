<!doctype html>
<meta charset="utf-8">
<title>Kev state cache test</title>
<pre id="log" style="font: 13px ui-monospace, monospace"></pre>
<script type="module">
import { Kevala } from "../../js/src/index.js";
const log = (s) => (document.getElementById("log").textContent += s + "\n");
window.ct = null;
const backend = new URLSearchParams(location.search).get("backend") || "webgpu";
const Q = {
  a: { type: "noul", instructions: "Does the customer want money back?" },
  b: { type: "choice", instructions: "Which team?", criteria: { billing: "payments", shipping: "deliveries", other: null } },
};
const base = "Order #4411 arrived two weeks late and the box was crushed on one side. I was also charged twice for it on my credit card, and the second charge is still pending.";
const longer = base + " I called support on Monday and nobody answered, so please refund the duplicate charge today.";
const flat = (r) => [...r.raw_probabilities.a, ...r.raw_probabilities.b];
const diff = (a, b) => Math.max(...a.map((v, i) => Math.abs(v - b[i])));
try {
  const warm = await Kevala.load({ model: "../../tmp/kev-0.8b-q8.kevala", backend });
  const t = [];
  const time = async (s) => { const t0 = performance.now(); const r = await warm.decide(s, Q); t.push(Math.round(performance.now() - t0)); return r; };
  const miss = await time(base);
  const hit = await time(base);
  const ext = await time(longer);
  const stats = ext.timing.cache;
  warm.dispose();
  const cold = await Kevala.load({ model: "../../tmp/kev-0.8b-q8.kevala", backend });
  const fresh = await cold.decide(longer, Q);
  cold.dispose();
  window.ct = { backend, stats, ms: { miss: t[0], hit: t[1], extension: t[2] }, hitVsMiss: diff(flat(hit), flat(miss)), extVsFresh: diff(flat(ext), flat(fresh)) };
} catch (e) { window.ct = { error: e.message }; }
log(JSON.stringify(window.ct));
</script>
